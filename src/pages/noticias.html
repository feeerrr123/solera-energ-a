<!DOCTYPE html>
<html lang="{{ sitio.idioma }}" class="scroll-smooth">
<head>
{{> head}}
</head>
<body class="font-sans text-ink antialiased">
{{> cabecera}}

  <main id="contenido">
    <section class="border-b border-line">
      <div class="mx-auto max-w-shell px-5 py-14 sm:px-8 sm:py-20">
        <p class="font-mono text-[11px] uppercase tracking-[0.22em] text-ink-soft">{{ noticias.eyebrow }}</p>
        <h1 class="mt-2 max-w-3xl font-display text-[2.4rem] leading-[1.1] text-ink sm:text-[3.2rem]">{{ noticias.titular }}</h1>
        <p class="measure mt-5 text-[17px] leading-relaxed text-ink-soft">{{ noticias.intro }}</p>
        <p class="measure mt-6 rounded-xl border border-line-strong bg-paper-deep/60 px-5 py-4 text-[14px] leading-relaxed text-ink-soft">{{ noticias.aviso }}</p>
      </div>
    </section>

    <!-- Noticias: las publicadas en el panel (vía /api/noticias) sustituyen a las de ejemplo de la config.
         La tarjeta es un solo parcial (partials/noticia-card.html) para las dos cosas. -->
    <section class="border-b border-line">
      <div class="mx-auto max-w-shell px-5 py-10 sm:px-8 sm:py-14">
        <div id="noticias-lista" class="divide-y divide-line border-y border-line">
          {{#if demo}}{{#each noticias.ejemplos}}{{> noticia-card}}
          {{/each}}{{/if}}
        </div>
        <p id="noticias-vacio" {{#if demo}}hidden{{/if}} class="py-10 text-[15px] text-ink-soft">{{ noticias.vacio }}</p>
        <template id="tpl-noticia">{{@molde noticia-card}}</template>
      </div>
    </section>

    <section>
      <div class="mx-auto max-w-shell px-5 py-14 text-center sm:px-8 sm:py-16">
        <p class="font-display text-2xl text-ink">{{ noticias.cta.texto }}</p>
        <a href="{{ noticias.cta.pagina }}" class="mt-6 inline-block rounded-full bg-ochre px-6 py-3 text-[15px] font-semibold text-paper-raised shadow-field u-curve transition hover:bg-ochre-deep">{{ noticias.cta.boton }}</a>
      </div>
    </section>
  </main>

{{> pie}}

{{> whatsapp}}

  <script>
{{@include js/menu.js}}
  </script>
  <script type="module">
{{@include js/noticias-remotas.js}}
  </script>
</body>
</html>
